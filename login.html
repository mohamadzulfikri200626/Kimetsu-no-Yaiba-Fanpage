<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Demon Slayer Corps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman-login">

  <main>
    <section class="panel-login">
      <h1>DEMON SLAYER CORPS</h1>
      <p>Only those who vow to protect humanity from the darkness may enter.</p>

      <form action="index.html" method="get">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Demon Slayer name" autocomplete="off">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="off">

        <button class="tombol" type="submit">Login</button>
      </form>

      <a href="index.html">&larr; Back to the home page</a>
    </section>
  </main>

</body>
</html>
